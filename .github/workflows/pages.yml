name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Package static website
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp index.html privacy.html style.css light-theme.css app.js "$RUNNER_TEMP/site/"
          cp -R assets "$RUNNER_TEMP/site/assets"
          tar --dereference --hard-dereference -cvf "$RUNNER_TEMP/artifact.tar" -C "$RUNNER_TEMP/site" .
      - name: Upload Pages artifact
        uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
